name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # 1. Cấu hình Matrix Strategy chạy trên 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        # BÀI 5: Đổi từ 'package' sang 'verify' để kích hoạt JaCoCo Check (80%)
        # Nếu coverage dưới 80%, bước này sẽ báo lỗi X đỏ ngay lập tức
        run: mvn clean verify

      - name: Upload JaCoCo Coverage Report
        # BÀI 5: Trích xuất và lưu trữ báo cáo bao phủ code
        # 'if: always()' đảm bảo báo cáo vẫn được upload kể cả khi build fail (để Hiếu xem tại sao fail)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: "**/target/site/jacoco/"

      - name: Upload Build Artifact
        # Giữ lại bước upload file Jar từ bài cũ
        if: matrix.os == 'ubuntu-latest' && success()
        uses: actions/upload-artifact@v4
        with:
          name: Final-Project-Artifacts
          path: "**/target/*.jar"