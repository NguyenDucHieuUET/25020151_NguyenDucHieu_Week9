name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # 1. Cấu hình Matrix Strategy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # 2. Sử dụng biến matrix.os để chạy trên nhiều hệ điều hành
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        # Lệnh này sẽ chạy các Unit Test mà bạn đã tạo ở bước lỗi đường dẫn
        run: mvn clean package

      - name: Upload Build Artifact
        # Chỉ upload artifact từ máy Ubuntu để tránh trùng lặp hoặc lỗi nếu muốn
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Bai3-Executable-Jar
          path: Bai3/target/*.jar